name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # Runs the Store contract against PostgreSQL as well as in memory.
          PGTEST_PORT: "5432"
          PGTEST_USER: postgres
          PGTEST_PASSWORD: postgres
      - run: pnpm --filter @inside-tech/web build
      - run: pnpm --filter @inside-tech/web exec playwright install --with-deps chromium
      - name: Independent black box review
        run: pnpm --filter @inside-tech/web e2e e2e/blackbox.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackbox-review
          path: apps/web/test-results/**/*.png
      - name: Three complete Playwright runs
        run: |
          for run in 1 2 3; do
            echo "Full Playwright run $run"
            pnpm --filter @inside-tech/web e2e || exit 1
          done
        env:
          CI: "true"
